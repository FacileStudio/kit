[workspace]
resolver = "2"
members = ["crates/kit-core", "crates/kit"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/FacileStudio/kit"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
anyhow = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
tempfile = "3"
fd-lock = "4"
dirs = "6"
semver = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dialoguer = { version = "0.11", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
