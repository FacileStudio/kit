name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install filet
        run: |
          GOBIN="${RUNNER_TEMP}/filet-bin" go install github.com/FacileStudio/filet@v0.21.0
          echo "${RUNNER_TEMP}/filet-bin" >> "$GITHUB_PATH"

      - name: Check
        run: sh scripts/check.sh

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Real nix tests
        run: cargo test --workspace --locked -- --ignored
